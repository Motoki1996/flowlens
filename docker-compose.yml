# FlowLens local development stack.
# Usage: `make dev` (or `docker compose up`).
services:
  db:
    image: postgres:16-alpine
    container_name: flowlens-db
    environment:
      POSTGRES_USER: flowlens
      POSTGRES_PASSWORD: flowlens
      POSTGRES_DB: flowlens
    ports:
      # Host port 55432 avoids clashing with any local Postgres on 5432/5433.
      # Inside the compose network the API still uses db:5432.
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlens -d flowlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    container_name: flowlens-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      API_PORT: "8080"
      # Inside the compose network the DB host is the service name "db".
      DATABASE_URL: postgres://flowlens:flowlens@db:5432/flowlens?sslmode=disable
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:4000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      # The API applies its own embedded migrations on startup, so a fresh
      # clone needs no separate `make migrate`.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      # The browser reaches the API through the web service's proxy, so
      # one hop is trusted for the per-IP rate limiters (see
      # internal/http/ratelimit.go).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (base64, 32 bytes — e.g. openssl rand -base64 32)}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SYNC_WORKER_ENABLED: ${SYNC_WORKER_ENABLED:-true}
      SYNC_WORKER_POLL_INTERVAL: ${SYNC_WORKER_POLL_INTERVAL:-5s}
      # Self-hosted GitLab CE usually presents a certificate this container
      # cannot verify, so verification is off by default. Mount the CA below
      # and point GITLAB_CA_CERT_FILE at it to turn it back on.
      GITLAB_TLS_INSECURE_SKIP_VERIFY: ${GITLAB_TLS_INSECURE_SKIP_VERIFY:-true}
      GITLAB_CA_CERT_FILE: ${GITLAB_CA_CERT_FILE:-}
    ports:
      - "8080:8080"
    volumes:
      # Mount source for hot reload (air rebuilds on change).
      - ./apps/api:/app
      # Keep the module cache out of the bind mount.
      - go-mod-cache:/go/pkg/mod
      # To verify an on-prem GitLab CE certificate instead of skipping the
      # check, mount its CA here and set GITLAB_CA_CERT_FILE to the container
      # path, e.g.:
      #   - ./certs/corp-ca.pem:/etc/ssl/certs/corp-ca.pem:ro

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: flowlens-web
    depends_on:
      - api
    environment:
      # Server components reach the API via the compose network, and this
      # is also the rewrite destination the browser's calls are proxied to
      # (apps/web/next.config.ts).
      API_INTERNAL_URL: http://api:8080
      # Empty is the shipped default: the browser calls this origin and the
      # rewrites proxy through. Set it only to test a separate API origin.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  db-data:
  go-mod-cache:
