          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
            - owner
            - member
            - viewer
        isProjectOwner:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AddProjectMemberRequest:
