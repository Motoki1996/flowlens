name: Release

# Publishes the images a self-hoster installs from (docs/self-hosting.md).
# Tag-driven so the version in the image, the git tag and the release notes
# are the same string by construction.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v1.2.3)"
        required: true

permissions:
  contents: write   # attach the offline image bundle to the release
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # github.repository_owner keeps the account's original casing
      # ("Motoki1996"), but a Docker repository name must be lowercase, so
      # using it raw fails buildx before a single layer is built. compose.yaml
      # hardcodes the lowercase form, which is why nothing catches this until
      # a tag is pushed.
      - name: Resolve version and owner
        id: version
        run: |
          echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # arm64 matters here: plenty of self-hosters are on Apple Silicon or
      # an ARM VPS, and an amd64-only image fails for them at `docker compose
      # up` with nothing but an exec-format error to go on.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/flowlens-api:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/flowlens-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No NEXT_PUBLIC_API_BASE_URL build arg on purpose: the published
      # image is same-origin, which is what makes one build serve every
      # self-hoster's hostname (apps/web/lib/config.ts).
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/flowlens-web:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/flowlens-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  offline-bundle:
    # An air-gapped network is a normal place to find on-prem GitLab CE, so
    # ship an installable artifact that needs no registry at all.
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lowercased for the same reason as the images job above: a Docker
      # repository name may not carry the account's original casing.
      - name: Resolve version and owner
        id: version
        run: |
          echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Pull and bundle the images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ steps.version.outputs.owner }}
        run: |
          set -euo pipefail
          images="ghcr.io/$OWNER/flowlens-api:$VERSION ghcr.io/$OWNER/flowlens-web:$VERSION postgres:16-alpine"
          for image in $images; do docker pull --platform linux/amd64 "$image"; done
          docker save $images | gzip > "flowlens-$VERSION-images-amd64.tar.gz"

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flowlens-*-images-amd64.tar.gz
            compose.yaml
            compose.tls.yaml
            .env.example
