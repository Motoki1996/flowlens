allTasks:
  get:
    summary: Cross-project task collection
    description: >
      Every task across every project the caller owns or is a member of
      (issue #76). Session-only — a project API token is scoped to a
      single project and has no notion of "every project I own".
    tags: [tasks]
    security:
      - cookieAuth: []
    parameters:
      - in: query
        name: status
        schema: { type: string, enum: [open, closed] }
      - in: query
        name: priority
        schema: { type: string, enum: [low, medium, high, urgent] }
      - in: query
        name: progress
        schema: { type: string, enum: [not_started, in_progress, on_hold, done] }
      - in: query
        name: size
        schema: { type: string, enum: [xs, s, m, l, xl] }
      - in: query
        name: epic_id
        description: 'An epic UUID, or "unassigned" for the tasks in no epic at all.'
        schema: { type: string }
      - in: query
        name: assignee
        description: '"me", a user UUID, or "unassigned".'
        schema: { type: string }
      - in: query
        name: projectId
        description: >-
          Repeatable. Narrows to these projects — still only ones the caller
          owns or is a member of, never a way to reach someone else's.
        schema: { type: array, items: { type: string, format: uuid } }
      - in: query
        name: dueBefore
        schema: { type: string, format: date }
      - in: query
        name: dueAfter
        schema: { type: string, format: date }
      - in: query
        name: startedBefore
        schema: { type: string, format: date }
      - in: query
        name: q
        description: Free-text match on the task's title or description.
        schema: { type: string }
      - in: query
        name: limit
        description: Page size, under its original name. Alias of per_page, which wins when both are given.
        schema: { type: integer }
      - in: query
        name: page
        description: 1-based page number; omit for the first page.
        schema: { type: integer }
      - in: query
        name: per_page
        description: Page size. Defaults to 50, clamped to 200.
        schema: { type: integer }
      - in: query
        name: sort
        schema: { type: string, enum: [dueOn, priority, progress, size, updatedAt] }
    responses:
      "200":
        description: One page of matching tasks, each carrying its project's name
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/TasksWithProjectPage' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
