# FlowLens production stack.
# Usage: `docker compose -f docker-compose.prod.yml up --build`
# (or `make build-images` to build the images without starting them).
#
# Standalone rather than an overlay of docker-compose.yml: Compose merges
# (rather than replaces) list fields like `volumes` across `-f` files, so an
# overlay could not cleanly drop the dev hot-reload bind mounts.
services:
  db:
    image: postgres:16-alpine
    container_name: flowlens-db
    environment:
      POSTGRES_USER: flowlens
      POSTGRES_PASSWORD: flowlens
      POSTGRES_DB: flowlens
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlens -d flowlens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: flowlens-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      API_PORT: "8080"
      DATABASE_URL: postgres://flowlens:flowlens@db:5432/flowlens?sslmode=disable
      WEB_BASE_URL: ${WEB_BASE_URL:?Set WEB_BASE_URL in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (base64, 32 bytes — e.g. openssl rand -base64 32)}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SYNC_WORKER_ENABLED: ${SYNC_WORKER_ENABLED:-true}
      SYNC_WORKER_POLL_INTERVAL: ${SYNC_WORKER_POLL_INTERVAL:-5s}
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      args:
        # Baked into the client bundle at build time — see the "Deploy"
        # section in README.md.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
    container_name: flowlens-web
    depends_on:
      - api
    environment:
      # Server-only: read at runtime, never exposed to the browser.
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
