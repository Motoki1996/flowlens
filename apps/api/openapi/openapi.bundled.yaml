openapi: 3.1.0
info:
  title: FlowLens API
  version: 0.2.0
  description: |
    FlowLens's Go API: local username/password auth, the project/backlog/ task tracker kept 1:1 with GitLab CE issues, project-scoped API tokens for AI agents (ADR-0009), the GitLab webhook receiver, and read-only merge-request/CI sync and delivery/flow/velocity metrics (ADR-0011). See README.md for the full feature narrative.
servers:
  - url: http://localhost:8080
    description: Local development (API container)
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      summary: Liveness / readiness probe
      tags:
        - system
      security: []
      responses:
        '200':
          description: API and database healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unreachable
  /version:
    get:
      summary: Build version
      tags:
        - system
      security: []
      responses:
        '200':
          description: The running API's version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /openapi.yaml:
    get:
      summary: This OpenAPI document (YAML)
      tags:
        - system
      security: []
      responses:
        '200':
          description: The bundled OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      summary: This OpenAPI document (JSON)
      tags:
        - system
      security: []
      responses:
        '200':
          description: The bundled OpenAPI 3.1 document, converted to JSON
          content:
            application/json:
              schema:
                type: object
  /auth/signup:
    post:
      summary: Create a local account
      description: Creates a user and starts a session for it. Rejected with 403 when signups are disabled and this isn't the instance's first account.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created, session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username or email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      summary: Log in
      description: Verifies credentials with bcrypt and issues a session cookie plus a CSRF cookie.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in, session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: Log out
      description: Revokes the current session and clears the session/CSRF cookies.
      tags:
        - auth
      security: []
      responses:
        '204':
          description: Logged out
  /webhooks/gitlab/{linkID}:
    post:
      summary: GitLab CE webhook receiver
      description: |
        Receives Issue Hook / Merge Request Hook / Pipeline Hook payloads for one linked GitLab project. Authenticated by the per-link webhook secret header (X-Gitlab-Token), not by session or bearer token.
      tags:
        - webhooks
      security: []
      parameters:
        - in: path
          name: linkID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Event accepted for processing
        '401':
          description: Missing or invalid webhook token
        '404':
          description: Unknown link
        '429':
          description: Rate limited
  /api/v1/me:
    get:
      summary: Get the authenticated user
      tags:
        - users
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/password:
    put:
      summary: Change the caller's own password
      description: |
        Verifies the current password, then replaces it. Every session the user holds is revoked and a fresh one is issued, so the caller stays logged in while any other session is cut. Session auth only — a project API token can never call this.
      tags:
        - users
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; a new session cookie is set
        '400':
          description: Invalid body, or the new password is shorter than 8 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated, or the current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/gitlab-identities:
    get:
      summary: List the caller's own GitLab identities
      description: One per GitLab base URL, used to match ?assignee=me against a task's assignee.
      tags:
        - users
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The caller's GitLab identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitlabIdentity'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Register (or replace) the caller's GitLab identity for a base URL
      tags:
        - users
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutGitlabIdentityRequest'
      responses:
        '200':
          description: The saved identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitlabIdentity'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tasks:
    get:
      summary: Cross-project task collection
      description: |
        Every task across every project the caller owns or is a member of (issue #76). Session-only — a project API token is scoped to a single project and has no notion of "every project I own".
      tags:
        - tasks
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - open
              - closed
        - in: query
          name: priority
          schema:
            type: string
            enum:
              - low
              - medium
              - high
              - urgent
        - in: query
          name: progress
          schema:
            type: string
            enum:
              - not_started
              - in_progress
              - on_hold
              - done
        - in: query
          name: sort
          schema:
            type: string
      responses:
        '200':
          description: Matching tasks, each carrying its project's name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskWithProject'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects:
    get:
      summary: List projects
      description: |
        Session: every project the caller owns or is a member of, optionally filtered to ?failedSync=true (used by /dashboard). Bearer token: always returns exactly the token's own single project.
      tags:
        - projects
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: failedSync
          schema:
            type: boolean
          description: Session-only. Restricts to projects with at least one permanently-failed sync job.
      responses:
        '200':
          description: Matching projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/:
    post:
      summary: Create a project
      description: Session-only — a bearer token cannot create a project (issue
      tags:
        - projects
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: The created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}:
    get:
      summary: Get a project
      tags:
        - projects
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '200':
          description: The project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update a project
      description: Session-only.
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: The updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a project
      description: Session-only — a bearer token cannot destroy its own project (issue
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '204':
          description: Deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/gitlab-connection:
    put:
      summary: Save (create or replace) a project's GitLab connection
      description: Session-only. The token is verified against GitLab before being stored, encrypted at rest.
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutGitlabConnectionRequest'
      responses:
        '200':
          description: The saved connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitlabConnection'
        '400':
          description: Invalid input, or the token could not be verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get a project's GitLab connection
      description: Session-only. Never returns the raw access token.
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitlabConnection'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a project's GitLab connection
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '204':
          description: Deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/gitlab-connection/test:
    post:
      summary: Test a project's GitLab connection
      description: Re-verifies the stored token against GitLab CE without changing anything.
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitlabConnectionTestResult'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/gitlab-connection/available-projects:
    get:
      summary: List GitLab projects the connection's token can see
      description: Feeds the "link a GitLab project" picker.
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Candidate GitLab projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableGitlabProject'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/notification-settings:
    put:
      summary: Save (create or replace) a project's daily digest notification settings
      description: Owner-only.
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutNotificationSettingsRequest'
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the project owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get a project's notification settings
      description: Owner-only.
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the project owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found (no settings saved yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/progress-sync-settings:
    put:
      summary: Save (create or replace) a project's progress-sync-on-close setting
      description: 'Owner-only. Opt-in (issue #202): when enabled, closing a task''s linked GitLab issue also moves the task''s progress to ''done''. Off by default.'
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutProgressSyncSettingsRequest'
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSyncSettings'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the project owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get a project's progress-sync-on-close setting
      description: Owner-only.
      tags:
        - projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '200':
          description: The settings, or their unconfigured (disabled) default if never saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSyncSettings'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the project owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/linked-gitlab-projects:
    get:
      summary: List a project's linked GitLab projects
      tags:
        - linked-gitlab-projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '200':
          description: Linked GitLab projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedGitlabProject'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Link a GitLab project
      description: Creates the link, starts an initial import, and (if APP_PUBLIC_URL is set) registers a webhook.
      tags:
        - linked-gitlab-projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkedGitlabProjectRequest'
      responses:
        '201':
          description: The created link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedGitlabProject'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/linked-gitlab-projects/{linkID}:
    get:
      summary: Get one of a project's linked GitLab projects
      tags:
        - linked-gitlab-projects
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
        - $ref: '#/components/parameters/linkID'
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedGitlabProject'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/api-tokens:
    get:
      summary: List a project's API tokens
      description: Never carries the raw token value — only tokenPrefix. Session-only.
      tags:
        - api-tokens
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      responses:
        '200':
          description: The project's tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIToken'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Issue a new API token
      description: Session-only (a token cannot mint another token — privilege escalation, issue
      tags:
        - api-tokens
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPITokenRequest'
      responses:
        '201':
          description: The created token, including its one-time raw value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/invites/{token}:
    get:
      summary: Preview a project invite
      description: |
        Resolves an invite token to the project and role it grants, for the acceptance screen. Unauthenticated on purpose — whoever holds the token is who this is for, and in the case the feature exists to serve they have no account yet. Every failure (unknown, expired, already used) is reported identically, so a caller cannot probe which invites existed.
      tags:
        - auth
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The invite's project and role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInvitePreview'
        '404':
          description: Invalid, expired or already-used invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/invites/accept:
    post:
      summary: Accept a project invite as the signed-in user
      description: |
        For someone who was sent an invite but already has an account. Someone with no account sends the same token with their signup instead (POST /auth/signup, inviteToken). Single-use: the invite is spent and the membership created atomically.
      tags:
        - members
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptProjectInviteRequest'
      responses:
        '200':
          description: The project joined, and the role granted
          content:
            application/json:
