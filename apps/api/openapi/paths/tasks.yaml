list:
  get:
    summary: List a project's tasks
    tags: [tasks]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
      - in: query
        name: backlog_id
        description: 'A backlog UUID, or "unassigned" for the tasks in no backlog at all.'
        schema: { type: string }
      - in: query
        name: epic_id
        description: 'An epic UUID, or "unassigned" for the tasks in no epic at all.'
        schema: { type: string }
      - in: query
        name: status
        schema: { type: string, enum: [open, closed] }
      - in: query
        name: priority
        schema: { type: string, enum: [low, medium, high, urgent] }
      - in: query
        name: progress
        schema: { type: string, enum: [not_started, in_progress, on_hold, done] }
      - in: query
        name: size
        schema: { type: string, enum: [xs, s, m, l, xl] }
      - in: query
        name: assignee
        description: '"me", a user UUID, or "unassigned". Matches the FlowLens assignee or, for a task, that user''s GitLab identity.'
        schema: { type: string }
      - in: query
        name: q
        description: Free-text match on the task's title.
        schema: { type: string }
      - in: query
        name: sort
        description: Omit for the tasks' creation order.
        schema: { type: string }
    responses:
      "200":
        description: Matching tasks
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '../components/schemas/domain.yaml#/Task' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: Not found
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
  post:
    summary: Create a task
    description: >
      Requires write scope for a bearer token. Resolves its GitLab issue
      destination (epic's own link -> backlog's own link -> project's default
      link -> nowhere) only at creation time; task_gitlab_links is
      authoritative afterward. Naming an epicId also files the task in that
      epic's backlog, whatever backlog_id came with it.
    tags: [tasks]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/requests.yaml#/CreateTaskRequest'
    responses:
      "201":
        description: The created task
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/Task' }
      "400":
        description: Invalid input
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "403":
        description: Token missing write scope
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: Not found
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }


bulk:
  post:
    summary: Bulk-create tasks and dependencies
    description: >
      Creates every task and dependency in the request in one all-or-nothing
      transaction (issue #201) — either everything commits or nothing does.
      Requires write scope for a bearer token. See BulkCreateTasksRequest
      for ref-based dependency wiring.
    tags: [tasks]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/requests.yaml#/BulkCreateTasksRequest'
    responses:
      "201":
        description: The created tasks and dependencies
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/BulkCreateTasksResponse' }
      "400":
        description: Invalid input (validation failure, unknown ref, or a cyclic dependency)
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "403":
        description: Token missing write scope
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: Not found
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }

