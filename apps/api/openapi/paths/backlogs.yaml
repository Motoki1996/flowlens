list:
  get:
    summary: List a project's backlogs
    tags: [backlogs]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
      - in: query
        name: status
        description: >-
          "open" (the default when omitted), "closed", or "all". Unlike the
          other filters, omitting this one is not "no filter": a closed
          backlog leaves the collection unless "closed" or "all" is asked for.
        schema: { type: string, enum: [open, closed, all] }
      - in: query
        name: priority
        schema: { type: string, enum: [low, medium, high, urgent] }
      - in: query
        name: progress
        schema: { type: string, enum: [not_started, in_progress, on_hold, done] }
      - in: query
        name: assignee
        description: '"me", a user UUID, or "unassigned".'
        schema: { type: string }
      - in: query
        name: sort
        schema: { type: string }
    responses:
      "200":
        description: The project's backlogs
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '../components/schemas/domain.yaml#/Backlog' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: Not found
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
  post:
    summary: Create a backlog
    description: Requires write scope for a bearer token.
    tags: [backlogs]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/requests.yaml#/CreateBacklogRequest'
    responses:
      "201":
        description: The created backlog
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/Backlog' }
      "400":
        description: Invalid input
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "403":
        description: Token missing write scope
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: Not found
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }


