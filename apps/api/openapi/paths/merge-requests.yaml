list:
  get:
    summary: List a project's merge requests
    description: Read-only — FlowLens never writes a merge request back to GitLab.
    tags: [merge-requests]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
      - in: query
        name: state
        schema: { type: string }
      - in: query
        name: author
        schema: { type: string }
      - in: query
        name: taskId
        schema: { type: string, format: uuid }
      - in: query
        name: since
        schema: { type: string, format: date-time }
      - in: query
        name: until
        schema: { type: string, format: date-time }
      - in: query
        name: sort
        description: >-
          Order of the returned page. Defaults to "created"
          (gitlab_created_at, newest first) when omitted.
        schema: { type: string, enum: [created, updated] }
      - in: query
        name: page
        description: 1-based page number. Defaults to the first page.
        schema: { type: integer, minimum: 1 }
      - in: query
        name: per_page
        description: Page size, defaulting to 30 and clamped to 100.
        schema: { type: integer, minimum: 1, maximum: 100 }
    responses:
      "200":
        description: One page of matching merge requests
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/MergeRequestsPage' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: Not found
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }

get:
  get:
    summary: Get a merge request
    tags: [merge-requests]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/mergeRequestID'
    responses:
      "200":
        description: The merge request
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/MergeRequest' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: Not found
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }

components:
  parameters:
    projectID:
      in: path
      name: projectID
      required: true
      schema: { type: string, format: uuid }
    mergeRequestID:
      in: path
      name: mergeRequestID
      required: true
      schema: { type: string, format: uuid }
