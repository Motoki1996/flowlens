context:
  get:
    summary: Get a task's AI-facing context
    description: >
      The primary read for an AI agent working a task: description,
      acceptance criteria, allowed/forbidden scope, base branch, GitLab
      issue state, and recent comments. The base branch and the
      allowed/forbidden scope are resolved from the task's epic first and
      its backlog second, per field, so an epic that overrides only the
      branch still inherits its backlog's scope. Already project-scoped
      through the bearer token itself, so no separate ownership check
      against {taskID} is needed on top.
    tags: [tasks]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/taskID'
    responses:
      "200":
        description: The task's context
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/TaskContext' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: Not found
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }

components:
  parameters:
    projectID:
      in: path
      name: projectID
      required: true
      schema: { type: string, format: uuid }
    taskID:
      in: path
      name: taskID
      required: true
      schema: { type: string, format: uuid }
    dependencyID:
      in: path
      name: dependencyID
      required: true
      schema: { type: string, format: uuid }
    commentID:
      in: path
      name: commentID
      required: true
      schema: { type: string, format: uuid }
