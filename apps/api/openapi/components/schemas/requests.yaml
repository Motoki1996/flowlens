SignupRequest:
  type: object
  properties:
    username: { type: string }
    email: { type: string, format: email }
    password: { type: string, minLength: 8 }
    inviteToken:
      type: string
      description: >
        A project invite token. When present and valid it both exempts this
        signup from ALLOW_SIGNUP and joins the new account to the invite's
        project with the invite's role.
  required: [username, email, password]

CreateProjectInviteRequest:
  type: object
  properties:
    role: { type: string, enum: [owner, member, viewer], default: member }
    expiresInDays:
      type: integer
      minimum: 1
      maximum: 90
      default: 7
      description: Omit (or 0) for the 7-day default.

AcceptProjectInviteRequest:
  type: object
  properties:
    token: { type: string }
  required: [token]

LoginRequest:
  type: object
  properties:
    identifier:
      type: string
      description: Username or email.
    password: { type: string }
  required: [identifier, password]

PutGitlabIdentityRequest:
  type: object
  properties:
    gitlabBaseUrl: { type: string }
    gitlabUserId: { type: integer, format: int64 }
    gitlabUsername: { type: string }
  required: [gitlabBaseUrl, gitlabUserId, gitlabUsername]

ChangePasswordRequest:
  type: object
  properties:
    currentPassword: { type: string }
    newPassword: { type: string, minLength: 8 }
  required: [currentPassword, newPassword]

CreateProjectRequest:
  type: object
  properties:
    name: { type: string }
    description: { type: string }
  required: [name]

UpdateProjectRequest:
  type: object
  properties:
    name: { type: string }
    description: { type: string }

PutGitlabConnectionRequest:
  type: object
  properties:
    baseUrl: { type: string }
    token: { type: string }
  required: [baseUrl, token]

PutProgressSyncSettingsRequest:
  type: object
  properties:
    enabled: { type: boolean }
  required: [enabled]

PutNotificationSettingsRequest:
  type: object
  properties:
    webhookUrl: { type: string }
    enabled: { type: boolean }
    sendHour:
      type: integer
      minimum: 0
      maximum: 23
  required: [webhookUrl, enabled, sendHour]

CreateLinkedGitlabProjectRequest:
  type: object
  properties:
    gitlabProjectId: { type: integer, format: int64 }
    syncScope: { type: string }
    syncLabels:
      type: array
      items: { type: string }
  required: [gitlabProjectId]

UpdateLinkedGitlabProjectRequest:
  type: object
  properties:
    syncScope: { type: string }
    syncLabels:
      type: array
      items: { type: string }
    isDefault: { type: boolean }

CreateSyncRunRequest:
  type: object
  properties:
    full:
      type: boolean
      description: Full re-fetch of every issue vs. an incremental diff since the last successful sync.

CreateAPITokenRequest:
  type: object
  properties:
    name: { type: string }
    scopes:
      type: array
      items: { type: string, enum: [read, write] }
    expiresAt: { type: [string, "null"], format: date-time }
  required: [name, scopes]

AddProjectMemberRequest:
  type: object
  properties:
    identifier:
      type: string
      description: Username or email of the user to add.
    role: { type: string, enum: [owner, member, viewer] }
  required: [identifier, role]

UpdateProjectMemberRequest:
  type: object
  properties:
    role: { type: string, enum: [owner, member, viewer] }
  required: [role]

CreateBacklogRequest:
  type: object
  properties:
    name: { type: string }
    description: { type: string }
    startDate: { type: [string, "null"], format: date-time }
    dueOn: { type: [string, "null"], format: date-time }
    priority: { type: string, enum: [low, medium, high, urgent] }
    progress: { type: string, enum: [not_started, in_progress, on_hold, done] }
    assigneeUserId:
      type: [string, "null"]
      format: uuid
      description: A project member to assign this backlog to. Rejected with invalid_assignee if the user is not a member.
  required: [name]

UpdateBacklogRequest:
  type: object
  description: Every field is optional-if-omitted (the update leaves it unchanged); send null to clear a nullable field.
  properties:
    name: { type: string }
    description: { type: string }
    position: { type: integer }
    startDate: { type: [string, "null"], format: date-time }
    dueOn: { type: [string, "null"], format: date-time }
    priority: { type: string, enum: [low, medium, high, urgent] }
    progress: { type: string, enum: [not_started, in_progress, on_hold, done] }
    assigneeUserId:
      type: [string, "null"]
      format: uuid
      description: A project member to assign this backlog to; null unassigns.

ReorderBacklogsRequest:
  type: object
  properties:
    backlogIds:
      type: array
      items: { type: string, format: uuid }
      description: The project's full, newly-ordered backlog ID list.
  required: [backlogIds]

CreateTaskRequest:
  type: object
  properties:
    title: { type: string }
    description: { type: string }
    backlogId: { type: [string, "null"], format: uuid }
    assigneeGitlabUserId: { type: [integer, "null"], format: int64 }
    assigneeGitlabUsername: { type: string }
    assigneeUserId:
      type: [string, "null"]
      format: uuid
      description: >-
        A project member to assign. Rejected with invalid_assignee if the user
        is not a member. Explicit null unassigns, which also clears the GitLab
        assignee unless assigneeGitlabUserId is set in the same request.
    labels:
      type: array
      items: { type: string }
    dueOn: { type: [string, "null"], format: date-time }
    startDate: { type: [string, "null"], format: date-time }
    priority: { type: string, enum: [low, medium, high, urgent] }
    progress: { type: string, enum: [not_started, in_progress, on_hold, done] }
  required: [title]

UpdateTaskRequest:
  type: object
  description: Every field is optional-if-omitted (the update leaves it unchanged); send null to clear a nullable field.
  properties:
    title: { type: string }
    description: { type: string }
    backlogId: { type: [string, "null"], format: uuid }
    assigneeGitlabUserId: { type: [integer, "null"], format: int64 }
    assigneeGitlabUsername: { type: string }
    assigneeUserId:
      type: [string, "null"]
      format: uuid
      description: >-
        A project member to assign. Rejected with invalid_assignee if the user
        is not a member. Explicit null unassigns, which also clears the GitLab
        assignee unless assigneeGitlabUserId is set in the same request.
    labels:
      type: array
      items: { type: string }
    dueOn: { type: [string, "null"], format: date-time }
    startDate: { type: [string, "null"], format: date-time }
    priority: { type: string, enum: [low, medium, high, urgent] }
    progress: { type: string, enum: [not_started, in_progress, on_hold, done] }

AssignTaskBacklogRequest:
  type: object
  properties:
    backlogId:
      type: [string, "null"]
      format: uuid
      description: null unassigns the task from any backlog.

ReorderTasksRequest:
  type: object
  properties:
    backlogId:
      type: [string, "null"]
      format: uuid
      description: null targets the Unclassified group.
    taskIds:
      type: array
      items: { type: string, format: uuid }
      description: That bucket's full, newly-ordered task ID list.
  required: [taskIds]

UpsertTaskAIContextRequest:
  type: object
  properties:
    acceptanceCriteria: { type: string }
    aiContext: { type: string }

BulkCreateTasksRequest:
  type: object
  description: >
    Creates every task and dependency in one all-or-nothing transaction
    (issue #201). Each task's ref is a request-scoped temporary ID, valid
    only within this request, used to wire up dependencies between tasks
    that have no real ID yet.
  properties:
    tasks:
      type: array
      items: { $ref: '#/BulkCreateTaskItem' }
      minItems: 1
      maxItems: 100
    dependencies:
      type: array
      items: { $ref: '#/BulkCreateDependencyItem' }
  required: [tasks]

BulkCreateTaskItem:
  type: object
  properties:
    ref: { type: string, description: Request-scoped temporary ID for this task, unique within the request. }
    title: { type: string }
    description: { type: string }
    backlogId: { type: [string, "null"], format: uuid }
    labels:
      type: array
      items: { type: string }
    dueOn: { type: [string, "null"], format: date-time }
    startDate: { type: [string, "null"], format: date-time }
    priority: { type: string, enum: [low, medium, high, urgent] }
    size: { type: string, enum: [xs, s, m, l, xl] }
    aiContext:
      $ref: '#/UpsertTaskAIContextRequest'
  required: [ref, title]

BulkCreateDependencyItem:
  type: object
  description: >
    predecessorRef and successorRef must each name a ref from this same
    request's tasks — a bulk dependency can only connect two tasks created
    in the same request, not an already-existing task (use
    POST .../task-dependencies for that).
  properties:
    predecessorRef: { type: string }
    successorRef: { type: string }
  required: [predecessorRef, successorRef]

CreateTaskDependencyRequest:
  type: object
  properties:
    predecessorTaskId: { type: string, format: uuid }
    successorTaskId: { type: string, format: uuid }
  required: [predecessorTaskId, successorTaskId]

CreateTaskCommentRequest:
  type: object
  properties:
    body: { type: string }
  required: [body]
