      description: Read-only — FlowLens never writes a merge request back to GitLab.
      tags:
        - merge-requests
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectID'
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: author
          schema:
            type: string
        - in: query
          name: taskId
          schema:
            type: string
            format: uuid
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - updated
        - in: query
          name: page
          description: 1-based page number. Defaults to the first page.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: per_page
          description: Page size, defaulting to 30 and clamped to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One page of matching merge requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequestsPage'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/merge-requests/{mergeRequestID}:
    get:
      summary: Get a merge request
      tags:
        - merge-requests
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/mergeRequestID'
      responses:
        '200':
          description: The merge request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeRequest'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: flowlens_session
      description: |
        Session cookie set at login. Every session-authenticated mutation must also echo the flowlens_csrf cookie's value in the X-CSRF-Token header (internal/http/middleware.go's requireCSRF) — not expressible as a second apiKey scheme referencing the same request, so it is documented here instead of modeled.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Authorization: Bearer <project API token> (ADR-0009). Scoped to read/write and to a fixed route allowlist — only routes under the "shared" security option in this document accept a bearer token at all. No CSRF header is required or checked for bearer requests.
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ok
    Version:
      type: object
      properties:
        version:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
      required:
        - id
        - username
        - email
        - displayName
    Error:
      type: object
      description: The standard error envelope returned by every non-2xx response (internal/http/response.go's writeError).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: not found
          required:
            - code
            - message
      required:
        - error
    SignupRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        inviteToken:
          type: string
          description: |
            A project invite token. When present and valid it both exempts this signup from ALLOW_SIGNUP and joins the new account to the invite's project with the invite's role.
      required:
        - username
        - email
        - password
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Username or email.
        password:
          type: string
      required:
        - identifier
        - password
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword
    GitlabIdentity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gitlabBaseUrl:
          type: string
        gitlabUserId:
          type: integer
          format: int64
        gitlabUsername:
          type: string
    PutGitlabIdentityRequest:
      type: object
      properties:
        gitlabBaseUrl:
          type: string
        gitlabUserId:
          type: integer
          format: int64
        gitlabUsername:
          type: string
      required:
        - gitlabBaseUrl
        - gitlabUserId
        - gitlabUsername
    TaskGitlabInfo:
      type: object
      properties:
        syncStatus:
          type: string
        lastError:
          type: string
        lastSyncedAt:
          type:
            - string
            - 'null'
          format: date-time
        issueIid:
          type:
            - integer
            - 'null'
          format: int64
        webUrl:
          type: string
    TaskAIContext:
      type: object
      properties:
        acceptanceCriteria:
          type: string
        aiContext:
          type: string
        allowedScope:
          type: string
        forbiddenScope:
          type: string
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        backlogId:
          type:
            - string
            - 'null'
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - open
            - closed
          description: The GitLab issue state, synced both ways. Never the same axis as progress.
        closedAt:
          type:
            - string
            - 'null'
          format: date-time
        assigneeGitlabUserId:
          type:
            - integer
            - 'null'
          format: int64
        assigneeGitlabUsername:
          type: string
        labels:
          type: array
          items:
            type: string
        dueOn:
          type:
            - string
            - 'null'
          format: date-time
        startDate:
          type:
            - string
            - 'null'
          format: date-time
        priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
        progress:
          type: string
          enum:
            - not_started
            - in_progress
            - on_hold
            - done
        size:
          type: string
          enum:
            - xs
            - s
            - m
            - l
            - xl
        designStartedAt:
          type:
            - string
            - 'null'
          format: date-time
        implementationStartedAt:
          type:
            - string
            - 'null'
          format: date-time
        position:
          type: integer
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        gitlab:
          anyOf:
            - $ref: '#/components/schemas/TaskGitlabInfo'
            - type: 'null'
        aiContext:
          $ref: '#/components/schemas/TaskAIContext'
    TaskWithProject:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            projectName:
              type: string
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        failedSyncTaskCount:
          type: integer
          format: int64
          description: Present only on GET /projects?failedSync=true results.
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    GitlabConnection:
      type: object
      description: |
        A project's GitLab CE connection. The access token itself is never returned — only tokenLastFour and the verification status.
      properties:
        projectId:
          type: string
          format: uuid
        baseUrl:
          type: string
        tokenLastFour:
          type: string
        tokenGitlabUserId:
          type:
            - integer
            - 'null'
          format: int64
        tokenGitlabUsername:
          type: string
        verified:
          type: boolean
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastVerifyError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PutGitlabConnectionRequest:
      type: object
      properties:
        baseUrl:
          type: string
        token:
          type: string
      required:
        - baseUrl
        - token
    GitlabConnectionTestResult:
      type: object
      properties:
        verified:
          type: boolean
        error:
          type: string
    AvailableGitlabProject:
      type: object
      description: One GitLab project the connection's token can see, offered for linking.
      properties:
        id:
          type: integer
          format: int64
        pathWithNamespace:
          type: string
        name:
          type: string
        webUrl:
          type: string
    NotificationSettings:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        webhookUrl:
          type: string
        enabled:
          type: boolean
        sendHour:
          type: integer
          description: UTC hour (0-23) the daily digest is sent.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PutNotificationSettingsRequest:
      type: object
      properties:
        webhookUrl:
          type: string
        enabled:
          type: boolean
        sendHour:
          type: integer
          minimum: 0
          maximum: 23
      required:
        - webhookUrl
        - enabled
        - sendHour
    ProgressSyncSettings:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        enabled:
          type: boolean
          description: 'Opt-in (issue #202, off by default): when true, closing a task''s linked GitLab issue also moves the task''s progress to ''done''.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PutProgressSyncSettingsRequest:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    LinkedGitlabProject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gitlabConnectionId:
          type: string
          format: uuid
        gitlabProjectId:
          type: integer
          format: int64
        pathWithNamespace:
          type: string
        name:
          type: string
        webUrl:
          type: string
        syncScope:
          type: string
          description: What subset of issues to sync (e.g. all, or filtered by label).
        syncLabels:
          type: array
          items:
            type: string
        isDefault:
          type: boolean
          description: Whether this is the project's default GitLab project for new tasks.
        initialImportStatus:
          type: string
        lastSyncedAt:
          type:
            - string
            - 'null'
          format: date-time
        webhookStatus:
          type: string
        webhookRegisteredAt:
          type:
            - string
            - 'null'
          format: date-time
        webhookError:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateLinkedGitlabProjectRequest:
      type: object
      properties:
        gitlabProjectId:
          type: integer
          format: int64
        syncScope:
          type: string
        syncLabels:
          type: array
          items:
            type: string
      required:
        - gitlabProjectId
    APIToken:
      type: object
      description: |
        A project-scoped API token (ADR-0009). The raw bearer value is present only in the response body of POST .../api-tokens — every other response carries just tokenPrefix.
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - write
        tokenPrefix:
          type: string
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: The raw bearer secret. Present only in the create response, never again.
    CreateAPITokenRequest:
      type: object
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - write
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - name
        - scopes
    ProjectInvitePreview:
      type: object
      description: What the holder of an invite token is told before accepting.
      properties:
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        role:
          type: string
          enum:
            - owner
            - member
            - viewer
        expiresAt:
          type: string
          format: date-time
    AcceptProjectInviteRequest:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    ProjectInvite:
      type: object
      description: |
        A single-use credential that admits one person to one project, so an instance with ALLOW_SIGNUP=false can still onboard someone. The raw token is returned only by the create call.
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - owner
            - member
            - viewer
        tokenPrefix:
          type: string
          description: Leading characters of the raw token
          for telling invites apart in a list.: null
        status:
          type: string
          enum:
            - pending
            - accepted
            - expired
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateProjectInviteRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - owner
            - member
            - viewer
          default: member
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 7
          description: Omit (or 0) for the 7-day default.
    ProjectInviteWithToken:
      allOf:
        - $ref: '#/components/schemas/ProjectInvite'
        - type: object
          properties:
            token:
              type: string
              description: The raw invite token, present only in the create response.
    ProjectMember:
      type: object
