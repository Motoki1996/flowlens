byGitlabIssue:
  get:
    summary: Get a task by the GitLab issue it mirrors
    description: >-
      Resolves a GitLab issue IID to the task mirroring it and returns that task exactly as GET /api/v1/tasks/{taskID} does. For a caller that knows only the issue number — an AI agent on a branch named after the issue — since every other task endpoint is keyed by the task's UUID. Every write route below carries the same resolution, so an agent that only ever learns the IID never has to address the task by UUID at all. gitlabProjectId is needed only when the project links more than one GitLab project, where the same IID can exist in each; without it that case answers 409 rather than picking one.
    tags: [tasks]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
      - $ref: '#/components/parameters/issueIid'
      - $ref: '#/components/parameters/gitlabProjectIdQuery'
    responses:
      "200":
        description: The task
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/Task' }
      "400":
        description: Invalid issue iid or query
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: No task mirrors that issue
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "409":
        description: The IID matches more than one linked GitLab project
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
  patch:
    summary: Update a task by the GitLab issue it mirrors
    description: >-
      Identical to PATCH /api/v1/tasks/{taskID}, addressed by the GitLab issue IID the task mirrors instead of by its own UUID; the IID is resolved to that task first and the request then behaves exactly as the PATCH /api/v1/tasks/{taskID} route does. Requires write scope for a bearer token.
    tags: [tasks]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
      - $ref: '#/components/parameters/issueIid'
      - $ref: '#/components/parameters/gitlabProjectIdQuery'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/requests.yaml#/UpdateTaskRequest'
    responses:
      "200":
        description: The updated task
        content:
          application/json:
            schema: { $ref: '../components/schemas/domain.yaml#/Task' }
      "400":
        description: Invalid input, issue iid or query
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "403":
        description: Token missing write scope
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: No task mirrors that issue
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "409":
        description: The IID matches more than one linked GitLab project
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
  delete:
    summary: Delete a task by the GitLab issue it mirrors
    description: >-
      Identical to DELETE /api/v1/tasks/{taskID}, addressed by the GitLab issue IID the task mirrors instead of by its own UUID; the IID is resolved to that task first and the request then behaves exactly as the DELETE /api/v1/tasks/{taskID} route does. Requires write scope for a bearer token.
    tags: [tasks]
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/projectID'
      - $ref: '#/components/parameters/issueIid'
      - $ref: '#/components/parameters/gitlabProjectIdQuery'
    responses:
      "204":
        description: Deleted
      "400":
        description: Invalid issue iid or query
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "403":
        description: Token missing write scope
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "404":
        description: No task mirrors that issue
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "409":
        description: The IID matches more than one linked GitLab project
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }

