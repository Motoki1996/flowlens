name: Web E2E

# Runs the Playwright browser smoke test against a real API + web + Postgres.
# Separate from web-checks.yml (static checks only) and api-tests.yml (Go
# only), since this is the one job that needs both apps and a database up at
# once. Mirrors the postgres service from api-tests.yml. See docs/testing.md
# for what belongs in this layer.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/web-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowlens
          POSTGRES_PASSWORD: flowlens
          POSTGRES_DB: flowlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://flowlens:flowlens@localhost:5432/flowlens?sslmode=disable
      ENCRYPTION_KEY: 9cSBq+jy/e14AD9VNMThJxTH+gv3fexaER/TH8fUHvA=

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Download Go modules
        working-directory: apps/api
        run: go mod download

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Apply migrations
        working-directory: apps/api
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        # No --with-deps: ubuntu-latest already ships every shared library
        # Chromium needs. --with-deps only adds CJK/Cyrillic fonts via apt,
        # and that apt fetch has been observed taking 9+ minutes (a flaky
        # mirror, not the Playwright CDN) while the actual browser download
        # takes seconds. smoke.spec.ts types ASCII only and does no visual
        # comparison, so those fonts aren't needed here.
        run: npx playwright install chromium

      - name: Run e2e tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
