    BulkCreateDependencyItem:
      type: object
      description: |
        predecessorRef and successorRef must each name a ref from this same request's tasks — a bulk dependency can only connect two tasks created in the same request, not an already-existing task (use POST .../task-dependencies for that).
      properties:
        predecessorRef:
          type: string
        successorRef:
          type: string
      required:
        - predecessorRef
        - successorRef
    BulkCreateTasksRequest:
      type: object
      description: |
        Creates every task and dependency in one all-or-nothing transaction (issue #201). Each task's ref is a request-scoped temporary ID, valid only within this request, used to wire up dependencies between tasks that have no real ID yet.
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/BulkCreateTaskItem'
          minItems: 1
          maxItems: 100
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/BulkCreateDependencyItem'
      required:
        - tasks
