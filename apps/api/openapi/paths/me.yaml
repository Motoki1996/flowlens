me:
  get:
    summary: Get the authenticated user
    tags: [users]
    security:
      - cookieAuth: []
    responses:
      "200":
        description: The current user
        content:
          application/json:
            schema:
              $ref: '../components/schemas/domain.yaml#/User'
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }

gitlabIdentities:
  get:
    summary: List the caller's own GitLab identities
    description: One per GitLab base URL, used to match ?assignee=me against a task's assignee.
    tags: [users]
    security:
      - cookieAuth: []
    responses:
      "200":
        description: The caller's GitLab identities
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '../components/schemas/domain.yaml#/GitlabIdentity' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
  put:
    summary: Register (or replace) the caller's GitLab identity for a base URL
    tags: [users]
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/requests.yaml#/PutGitlabIdentityRequest'
    responses:
      "200":
        description: The saved identity
        content:
          application/json:
            schema:
              $ref: '../components/schemas/domain.yaml#/GitlabIdentity'
      "400":
        description: Invalid input
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "401":
        description: Not authenticated
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }

password:
  put:
    summary: Change the caller's own password
    description: >
      Verifies the current password, then replaces it. Every session the user
      holds is revoked and a fresh one is issued, so the caller stays logged
      in while any other session is cut. Session auth only — a project API
      token can never call this.
    tags: [users]
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/requests.yaml#/ChangePasswordRequest'
    responses:
      "204":
        description: Password changed; a new session cookie is set
      "400":
        description: Invalid body, or the new password is shorter than 8 characters
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "401":
        description: Not authenticated, or the current password is incorrect
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
      "429":
        description: Too many attempts
        content:
          application/json:
            schema: { $ref: '../components/schemas/error.yaml#/Error' }
