openapi: 3.1.0
info:
  title: FlowLens API
  version: 0.2.0
  description: >
    FlowLens's Go API: local username/password auth, the project/backlog/
    task tracker kept 1:1 with GitLab CE issues, project-scoped API tokens
    for AI agents (ADR-0009), the GitLab webhook receiver, and read-only
    merge-request/CI sync and delivery/flow/velocity metrics
    (ADR-0011). See README.md for the full feature narrative.
servers:
  - url: http://localhost:8080
    description: Local development (API container)

security:
  - cookieAuth: []

paths:
  /healthz:
    $ref: './paths/system.yaml#/healthz'
  /version:
    $ref: './paths/system.yaml#/version'
  # /metrics (Prometheus, metrics-token auth) is deliberately excluded: it is
  # an operational endpoint scraped by infrastructure, not an API consumer
  # route, and carries no session/bearer/webhook auth this spec's security
  # schemes could describe.

  /openapi.yaml:
    $ref: './paths/openapi-spec.yaml#/openapiYaml'
  /openapi.json:
    $ref: './paths/openapi-spec.yaml#/openapiJson'

  /auth/signup:
    $ref: './paths/auth.yaml#/signup'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'

  /webhooks/gitlab/{linkID}:
    $ref: './paths/webhooks.yaml#/gitlabWebhook'

  /api/v1/me:
    $ref: './paths/me.yaml#/me'
  /api/v1/me/password:
    $ref: './paths/me.yaml#/password'
  /api/v1/me/gitlab-identities:
    $ref: './paths/me.yaml#/gitlabIdentities'

  /api/v1/tasks:
    $ref: './paths/tasks-global.yaml#/allTasks'

  /api/v1/projects:
    $ref: './paths/projects.yaml#/list'
  # chi mounts POST under this route group's own sub-router at "/" (see
  # server.go's protected.Route("/projects", ...)), which chi.Walk reports
  # as the literal path "/api/v1/projects/" (trailing slash) rather than
  # "/api/v1/projects" — distinct from the flat GET registered above.
  /api/v1/projects/:
    $ref: './paths/projects.yaml#/create'
  /api/v1/projects/{projectID}:
    get:
      $ref: './paths/projects.yaml#/get/get'
    patch:
      $ref: './paths/projects.yaml#/update/patch'
    delete:
      $ref: './paths/projects.yaml#/update/delete'
  /api/v1/projects/{projectID}/gitlab-connection:
    $ref: './paths/projects.yaml#/gitlabConnection'
  /api/v1/projects/{projectID}/gitlab-connection/test:
    $ref: './paths/projects.yaml#/gitlabConnectionTest'
  /api/v1/projects/{projectID}/gitlab-connection/available-projects:
    $ref: './paths/projects.yaml#/availableGitlabProjects'
  /api/v1/projects/{projectID}/notification-settings:
    $ref: './paths/projects.yaml#/notificationSettings'
  /api/v1/projects/{projectID}/progress-sync-settings:
    $ref: './paths/projects.yaml#/progressSyncSettings'
  /api/v1/projects/{projectID}/linked-gitlab-projects:
    $ref: './paths/projects.yaml#/linkedGitlabProjects'
  /api/v1/projects/{projectID}/linked-gitlab-projects/{linkID}:
    $ref: './paths/projects.yaml#/linkedGitlabProject'
  /api/v1/projects/{projectID}/api-tokens:
    $ref: './paths/projects.yaml#/apiTokens'
  /auth/invites/{token}:
    $ref: './paths/auth.yaml#/invitePreview'
  /api/v1/invites/accept:
    $ref: './paths/invites.yaml#/accept'
  /api/v1/invites/{inviteID}:
    $ref: './paths/invites.yaml#/invite'
  /api/v1/projects/{projectID}/invites:
    $ref: './paths/projects.yaml#/invites'
  /api/v1/projects/{projectID}/members:
    $ref: './paths/projects.yaml#/members'
  /api/v1/projects/{projectID}/members/{userID}:
    $ref: './paths/projects.yaml#/member'
  /api/v1/projects/{projectID}/member-candidates:
    $ref: './paths/projects.yaml#/memberCandidates'
  /api/v1/projects/{projectID}/sync-jobs:
    $ref: './paths/projects.yaml#/syncJobs'
  /api/v1/projects/{projectID}/metrics:
    $ref: './paths/projects.yaml#/metrics'
  /api/v1/projects/{projectID}/flow-metrics:
    $ref: './paths/projects.yaml#/flowMetrics'
  /api/v1/projects/{projectID}/velocity:
    $ref: './paths/projects.yaml#/velocity'

  /api/v1/api-tokens/{tokenID}:
    $ref: './paths/api-tokens.yaml#/apiToken'

  /api/v1/sync-jobs/{jobID}/retry:
    $ref: './paths/sync-jobs.yaml#/syncJobRetry'

  /api/v1/linked-gitlab-projects/{linkID}:
    $ref: './paths/linked-gitlab-projects.yaml#/linkedGitlabProject'
  /api/v1/linked-gitlab-projects/{linkID}/webhook:
    $ref: './paths/linked-gitlab-projects.yaml#/webhook'
  /api/v1/linked-gitlab-projects/{linkID}/sync-runs:
    $ref: './paths/linked-gitlab-projects.yaml#/syncRuns'
  /api/v1/linked-gitlab-projects/{linkID}/webhook-events:
    $ref: './paths/linked-gitlab-projects.yaml#/webhookEvents'
  /api/v1/linked-gitlab-projects/{linkID}/webhook-events/{eventID}:
    $ref: './paths/linked-gitlab-projects.yaml#/webhookEvent'
  /api/v1/linked-gitlab-projects/{linkID}/webhook-events/{eventID}/retry:
    $ref: './paths/linked-gitlab-projects.yaml#/webhookEventRetry'
  /api/v1/linked-gitlab-projects/{linkID}/members:
    $ref: './paths/linked-gitlab-projects.yaml#/members'
  /api/v1/linked-gitlab-projects/{linkID}/labels:
    $ref: './paths/linked-gitlab-projects.yaml#/labels'

  /api/v1/projects/{projectID}/epics:
    $ref: './paths/epics.yaml#/list'
  /api/v1/projects/{projectID}/epics/order:
    $ref: './paths/epics.yaml#/order'
  /api/v1/epics/{epicID}:
    $ref: './paths/epics.yaml#/epic'
  /api/v1/epics/{epicID}/tasks:
    $ref: './paths/epics.yaml#/tasks'
  /api/v1/projects/{projectID}/backlogs:
    $ref: './paths/backlogs.yaml#/list'
  /api/v1/projects/{projectID}/backlogs/order:
    $ref: './paths/backlogs.yaml#/order'
  /api/v1/backlogs/{backlogID}:
    $ref: './paths/backlogs.yaml#/backlog'

  /api/v1/projects/{projectID}/tasks:
    $ref: './paths/tasks.yaml#/list'
  /api/v1/projects/{projectID}/tasks/order:
    $ref: './paths/tasks.yaml#/order'
  /api/v1/projects/{projectID}/tasks/bulk:
    $ref: './paths/tasks.yaml#/bulk'
  /api/v1/projects/{projectID}/task-dependencies:
    $ref: './paths/tasks.yaml#/taskDependencies'
  /api/v1/task-dependencies/{dependencyID}:
    $ref: './paths/tasks.yaml#/taskDependency'
  /api/v1/projects/{projectID}/tasks/context:
    $ref: './paths/tasks.yaml#/projectTaskContexts'
  /api/v1/tasks/{taskID}:
    $ref: './paths/tasks.yaml#/task'
  /api/v1/tasks/{taskID}/close:
    $ref: './paths/tasks.yaml#/close'
  /api/v1/tasks/{taskID}/reopen:
    $ref: './paths/tasks.yaml#/reopen'
  /api/v1/tasks/{taskID}/assign-backlog:
    $ref: './paths/tasks.yaml#/assignBacklog'
  /api/v1/tasks/{taskID}/sync-retry:
    $ref: './paths/tasks.yaml#/syncRetry'
  /api/v1/tasks/{taskID}/ai-context:
    $ref: './paths/tasks.yaml#/aiContext'
  /api/v1/tasks/{taskID}/design-started:
    $ref: './paths/tasks.yaml#/designStarted'
  /api/v1/tasks/{taskID}/implementation-started:
    $ref: './paths/tasks.yaml#/implementationStarted'
  /api/v1/tasks/{taskID}/comments:
    $ref: './paths/tasks.yaml#/comments'
  /api/v1/task-comments/{commentID}:
    $ref: './paths/tasks.yaml#/comment'
  /api/v1/tasks/{taskID}/context:
    $ref: './paths/tasks.yaml#/context'

  /api/v1/projects/{projectID}/merge-requests:
    $ref: './paths/merge-requests.yaml#/list'
  /api/v1/merge-requests/{mergeRequestID}:
    $ref: './paths/merge-requests.yaml#/get'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: flowlens_session
      description: >
        Session cookie set at login. Every session-authenticated mutation
        must also echo the flowlens_csrf cookie's value in the
        X-CSRF-Token header (internal/http/middleware.go's requireCSRF) —
        not expressible as a second apiKey scheme referencing the same
        request, so it is documented here instead of modeled.
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Authorization: Bearer <project API token> (ADR-0009). Scoped to
        read/write and to a fixed route allowlist — only routes under the
        "shared" security option in this document accept a bearer token at
        all. No CSRF header is required or checked for bearer requests.
  schemas:
    Health:
      $ref: './components/schemas/domain.yaml#/Health'
    Version:
      $ref: './components/schemas/domain.yaml#/Version'
    User:
      $ref: './components/schemas/domain.yaml#/User'
    Error:
      $ref: './components/schemas/error.yaml#/Error'
